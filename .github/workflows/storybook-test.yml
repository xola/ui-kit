name: Storybook Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Storybook Tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    env:
      VITE_REACT_MAJOR: ${{ matrix.react }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.JS 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # npm ci runs the "prepare" script, generating src/theme.js and
      # public/theme.css that .storybook/main.js imports.
      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Install React ${{ matrix.react }}
        run: npm run react:${{ matrix.react }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Storybook interaction tests
        run: npm run test:storybook

      - name: Build
        run: npm run build

      - name: SSR import
        run: npm run test:ssr

      - name: Check bundle size (tree-shaking regression)
        run: npm run test:bundle-size

  consumer:
    name: 📦 Consumer build (Vite 8, React ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.JS 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Pack, install and build as a consumer
        run: npm run test:consumer -- --vite 8 --react ${{ matrix.react }}
