name: Storybook Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  affiliation:
    uses: ./.github/workflows/team-affiliation.yml
    secrets:
      ES_LINT_TOKEN: ${{ secrets.ES_LINT_TOKEN }}

  test:
    name: 🧪 Storybook Tests
    needs: affiliation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.JS 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # npm ci runs the "prepare" script, generating src/theme.js and
      # public/theme.css that .storybook/main.js imports.
      - name: Install Node Dependencies
        run: npm ci --no-fund --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Storybook interaction tests
        run: npm run test:storybook

      - name: Build
        run: npm run build

      - name: SSR import
        run: npm run test:ssr

      - name: Check bundle size (tree-shaking regression)
        run: npm run test:bundle-size
