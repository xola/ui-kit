name: Publish UI Kit Storybook

on:
  push:
    branches:
      - "master"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v1

      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Generate storybook
        run: npm run build:storybook

      # Pages runs Jekyll, which drops files whose names start with an underscore. Vite emits
      # assets/_commonjs-dynamic-modules-*.js, and without it the preview iframe fails to boot.
      - name: Disable Jekyll processing
        run: touch storybook-static/.nojekyll

      - name: Publish generated content to GitHub Pages
        uses: tsunematsu21/actions-publish-gh-pages@v1.0.2
        with:
          dir: storybook-static
          branch: gh-pages
          token: ${{ secrets.STORYBOOK_PUBLISH_TOKEN }}
