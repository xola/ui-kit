<title>Xola UI Kit</title>
<script>
    // Because <title> tag doesn't work properly since there is a previous <title> tag
    document.title = "Xola UI Kit";
</script>
<style type="text/css">
    /* Make the style consistent with the Xola theme. This can't be styled by variables so raw CSS is needed */
    .sidebar-subheading {
        color: #505254 !important; /* text-gray-darker */
        font-size: 12px !important;
        letter-spacing: 2px !important;
    }
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "warnOnLegacyHierarchySeparator": true,
  "buildStoriesJson": false,
  "storyStoreV7": true,
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": false
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs",
  "autodocs": "tag"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/runtime.js';

      
      import './sb-addons/links-0/manager-bundle.js';

      import './sb-addons/essentials-outline-7/manager-bundle.js';
      
      import './sb-addons/storybook-8/manager-bundle.js';
      
    </script>

    <link href="./sb-preview/runtime.js" rel="prefetch" as="script" />
